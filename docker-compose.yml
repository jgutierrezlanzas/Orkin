# Levanta SQL Server + API en Docker. La web (Blazor WASM) corre aparte en
# debug local y consume la API en http://localhost:5031.
#
#   docker compose up -d --build     # levanta (o reconstruye) todo
#   docker compose logs -f api       # ver el log de la API
#   docker compose down              # detener (los datos persisten en el volumen)
#
# La primera vez la API aplica migraciones y siembra catálogos + usuario admin
# automáticamente (RUN_SEED=true, CREATE_ADMIN_USER=true).
#
# ── Sobre los nombres ────────────────────────────────────────────────────────────
# Ni el contenedor, ni el volumen, ni la base llevan el nombre de un módulo. Son de la
# plataforma: el cotizador es el primer módulo que se apoya en ellos, no el dueño. Ponerles
# "cotizador" hoy obliga a renombrar los tres el día que entre el segundo módulo, y renombrar
# un volumen de datos en un ambiente que ya tiene historia es una operación con downtime.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orkin-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OrkinDev_2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - orkin-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "OrkinDev_2026", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Orkin.Cotizador.Api/Dockerfile
    container_name: orkin-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Entorno ────────────────────────────────────────────────────────────
      # Development: Swagger abierto, CORS con los orígenes locales, logs verbosos.
      - ASPNETCORE_ENVIRONMENT=Development
      # URL explícita: el ConfiguracionBootstrap reemplaza la configuración del host
      # y con ella el URL que lee Kestrel. Sin esto, la API escucha en el default (5000)
      # y el mapeo de puerto 5031:8080 no llega a nada.
      - ASPNETCORE_URLS=http://+:8080

      # ── Base de datos ───────────────────────────────────────────────────────
      # Dentro de la red de Docker, SQL Server es "db" (el nombre del servicio),
      # no "localhost". Encrypt=False porque el certificado autofirmado de SQL Server
      # en el contenedor no pasa la validación TLS del runtime de Linux.
      #
      # La base se llama "Orkin", sin el sufijo del módulo. La plataforma va a tener más
      # módulos que el cotizador, y el nombre de la base no es el lugar donde se decide eso.
      - Database__ConnectionString=Server=db,1433;Database=Orkin;User Id=sa;Password=OrkinDev_2026;TrustServerCertificate=True;Encrypt=False
      - Database__AplicarMigracionesAlArrancar=true

      # ── Seguridad (solo desarrollo; en producción van en un gestor) ─────────
      - Seguridad__ClaveFirma=Ty0r6tQ0bhKJ8U2nsPnIuqMPsoswjP4F2MWQ0Z1O8VzY=

      # ── Semilla inicial (solo la primera vez; luego es idempotente) ──────────
      - RUN_SEED=true
      - CREATE_ADMIN_USER=true
      - ADMIN_EMAIL=admin@orkin.local
      - ADMIN_PASSWORD=OrkinDev_2026

      # ── CORS: la web local en debug consume la API desde estos orígenes ──────
      - Cors__Origenes__0=http://localhost:59093
      - Cors__Origenes__1=https://localhost:59090
    ports:
      # Host 5031 → contenedor 8080 (el puerto por defecto de .NET en Docker).
      # La web local llama a http://localhost:5031 como si la API estuviera local.
      - "5031:8080"
    volumes:
      # ── Claves de Data Protection ───────────────────────────────────────────
      # Sin esto, `docker compose up --build` regenera el juego de claves en cada
      # reconstrucción del contenedor, y las contraseñas de las conexiones al ERP
      # guardadas en `int.ErpConexion` dejan de poder descifrarse. El síntoma es
      # desconcertante: la conexión está ahí, con su usuario y su nombre, y al probarla
      # responde que no tiene credenciales. Guardarlas en un volumen las sobrevive.
      #
      # En producción esto va montado cifrado y respaldado: perder el volumen es perder
      # las credenciales de todos los clientes conectados.
      - orkin-dp-keys:/root/.aspnet/DataProtection-Keys

volumes:
  orkin-data:
  orkin-dp-keys:
